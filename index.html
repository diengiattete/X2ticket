<!-- Thêm thư viện CryptoJS vào phần <head> -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<script>
  // Lưu chuỗi mã hóa MD5 của mật khẩu (không ai đọc được mật khẩu gốc từ chuỗi này)
  const ADMIN_PASSWORD_HASH = "3b8112520f922718ef8f2c38cc0e6a32";

  function handleLogin(e) {
    e.preventDefault();
    const pwdInput = document.getElementById("password").value;
    
    // Mã hóa mật khẩu người dùng vừa nhập sang MD5
    const inputHash = CryptoJS.MD5(pwdInput).toString();

    // So sánh 2 chuỗi mã hóa
    if (inputHash === ADMIN_PASSWORD_HASH) {
      sessionStorage.setItem("funchomper_authenticated", "true");
      showDashboard();
    } else {
      alert("Mật khẩu không chính xác!");
    }
  }
</script>

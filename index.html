<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Theo Dõi Funchomper - Firebase Auth</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-body: #090d16;
      --bg-surface: rgba(22, 30, 46, 0.85);
      --bg-input: rgba(15, 23, 42, 0.9);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-blue-glow: rgba(56, 189, 248, 0.25);
      --accent-green: #34d399;
      --accent-yellow: #fbbf24;
      --accent-red: #f87171;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    
    body { 
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg-body) 75%);
      color: var(--text-main); 
      min-height: 100vh; 
      padding: 16px 8px; 
    }
    
    .container { max-width: 1100px; margin: 0 auto; display: none; }

    .login-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 16px;
    }
    .login-box {
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      padding: 32px 20px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    .login-box .icon-logo { font-size: 36px; color: var(--accent-blue); margin-bottom: 12px; }
    .login-box h2 { font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; }
    .login-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
    
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }
    .form-input:focus { border-color: var(--accent-blue); }

    .btn-login, .btn-primary, .btn-cancel {
      padding: 12px 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-login { 
      width: 100%; 
      margin-top: 8px;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); 
      color: #fff; 
    }
    .btn-primary { background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #fff; }
    .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }

    .navbar { 
      display: flex; 
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px; 
      padding-bottom: 16px; 
      border-bottom: 1px solid var(--border-color); 
    }
    .navbar h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .navbar h1 i { color: var(--accent-blue); }
    
    .nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; width: 100%; }
    
    .role-badge {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .btn-logout { 
      background: rgba(248, 113, 113, 0.08); 
      color: var(--accent-red); 
      border: 1px solid rgba(248, 113, 113, 0.25); 
      padding: 6px 12px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 12px; 
      font-weight: 500; 
      margin-left: auto;
    }

    .card { 
      background: var(--bg-surface); 
      backdrop-filter: blur(12px);
      border-radius: 14px; 
      border: 1px solid var(--border-color); 
      padding: 16px 12px; 
    }
    .card-header { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 16px; gap: 12px; }
    .card-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .card-title i { color: var(--accent-blue); }

    .filter-box select { 
      width: 100%;
      background: var(--bg-input); 
      color: var(--text-main); 
      border: 1px solid var(--border-color); 
      padding: 8px 12px; 
      border-radius: 8px; 
      font-size: 13px; 
      outline: none; 
    }

    .table-container { overflow-x: auto; border-radius: 8px; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: left; min-width: 550px; }
    th { background: rgba(15, 23, 42, 0.7); padding: 10px 12px; font-size: 11px; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border-color); }
    td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 13px; }

    .badge-mac { font-family: monospace; background: rgba(15, 23, 42, 0.8); color: var(--accent-blue); padding: 3px 6px; border-radius: 4px; font-size: 11px; }
    .badge-fw { background: rgba(52, 211, 153, 0.1); color: var(--accent-green); padding: 3px 6px; border-radius: 4px; font-weight: 600; font-size: 11px; }
    .badge-group { background: rgba(56, 189, 248, 0.1); color: var(--accent-blue); padding: 3px 8px; border-radius: 12px; font-size: 11px; }

    .action-group { display: flex; gap: 6px; justify-content: flex-end; }
    .btn-edit, .btn-delete { border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 11px; display: inline-flex; align-items: center; gap: 4px; }
    .btn-edit { background: rgba(251, 191, 36, 0.1); color: var(--accent-yellow); border: 1px solid rgba(251, 191, 36, 0.25); }
    .btn-delete { background: rgba(248, 113, 113, 0.1); color: var(--accent-red); border: 1px solid rgba(248, 113, 113, 0.25); }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 8, 17, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 12px;
    }
    .modal-box {
      background: var(--bg-surface);
      padding: 20px 16px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 480px;
    }
    .modal-header { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; justify-content: space-between; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    @media (min-width: 640px) {
      body { padding: 32px 16px; }
      .navbar, .card-header { flex-direction: row; justify-content: space-between; align-items: center; }
    }
  </style>
</head>
<body>

<!-- MÀN HÌNH ĐĂNG NHẬP -->
<div class="login-overlay" id="loginScreen">
  <div class="login-box">
    <div class="icon-logo"><i class="fa-solid fa-shield-halved"></i></div>
    <h2>FUNCHOMPER SYSTEM</h2>
    <p>Đăng nhập bằng Firebase Auth</p>
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email Hệ Thống</label>
        <input type="email" id="email" class="form-input" placeholder="admin@funchomper.com" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Mật Khẩu</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" id="btnLogin">ĐĂNG NHẬP</button>
    </form>
  </div>
</div>

<!-- MÀN HÌNH QUẢN LÝ (DASHBOARD) -->
<div class="container" id="dashboardScreen">
  <div class="navbar">
    <h1><i class="fa-solid fa-microchip"></i> FUNCHOMPER</h1>
    <div class="nav-controls">
      <div id="userBadge" class="role-badge"><i class="fa-solid fa-user-check"></i> <span id="userEmail">Loading...</span></div>
      <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Thoát</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title"><i class="fa-solid fa-server"></i> Danh Sách Thiết Bị</div>
      <div class="filter-box">
        <select id="groupFilter" onchange="renderDevices()">
          <option value="ALL">-- Tất cả nhóm --</option>
        </select>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Tên Trạm</th>
            <th>Nhóm</th>
            <th>Địa Chỉ MAC</th>
            <th>FW</th>
            <th style="text-align: right;">Thao Tác</th>
          </tr>
        </thead>
        <tbody id="device-table-body">
          <tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding: 30px;">Đang lấy dữ liệu an toàn từ Firebase...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL EDIT DEVICE -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-header">
      <span><i class="fa-solid fa-pen-to-square" style="color:var(--accent-blue); margin-right:6px;"></i> Cập Nhật Trạm</span>
      <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal()"></i>
    </div>
    
    <input type="hidden" id="editDeviceId">

    <div class="form-group">
      <label for="editDeviceName">Tên Trạm / Thiết Bị</label>
      <input type="text" id="editDeviceName" class="form-input" placeholder="Nhập tên trạm...">
    </div>

    <div class="form-group">
      <label for="editGroupName">Tên Nhóm / Trung Tâm</label>
      <input type="text" id="editGroupName" class="form-input" placeholder="Nhập tên nhóm...">
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Hủy</button>
      <button class="btn-primary" onclick="saveDeviceChanges()">Lưu Thay Đổi</button>
    </div>
  </div>
</div>

<!-- FIREBASE SDKs (Thêm SDK Firebase Auth) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  // Cấu hình Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyDroRCHXWV_cspD1tbWgvTpr7yF-uqWWPM", // Điền API Key trong Firebase Project Settings
    authDomain: "trungio.firebaseapp.com",
    databaseURL: "https://trungio.firebaseio.com",
    projectId: "trungio"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  let globalDeviceData = null;

  // LẮNG NGHE TRẠNG THÁI XÁC THỰC (Firebase Auth State Listener)
  auth.onAuthStateChanged((user) => {
    if (user) {
      // Người dùng đã đăng nhập thành công
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("dashboardScreen").style.display = "block";
      document.getElementById("userEmail").innerText = user.email;

      // Kích hoạt đọc dữ liệu Firebase
      listenToDatabase();
    } else {
      // Người dùng chưa đăng nhập hoặc đã Logout
      document.getElementById("loginScreen").style.display = "flex";
      document.getElementById("dashboardScreen").style.display = "none";
    }
  });

  // XỬ LÝ ĐĂNG NHẬP QUA FIREBASE AUTH
  function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const btnLogin = document.getElementById("btnLogin");

    btnLogin.innerText = "ĐANG XÁC THỰC...";
    btnLogin.disabled = true;

    auth.signInWithEmailAndPassword(email, password)
      .catch((error) => {
        alert("Lỗi đăng nhập: " + error.message);
        btnLogin.innerText = "ĐĂNG NHẬP";
        btnLogin.disabled = false;
      });
  }

  // ĐĂNG XUẤT
  function logout() {
    auth.signOut().then(() => {
      location.reload();
    });
  }

  // ĐỌC DỮ LIỆU TỪ REALTIME DATABASE
  function listenToDatabase() {
    db.ref("devices").on("value", (snapshot) => {
      globalDeviceData = snapshot.val();
      if (globalDeviceData) {
        updateGroupDropdown(globalDeviceData);
      }
      renderDevices();
    }, (error) => {
      alert("Lỗi truy cập dữ liệu (Từ chối quyền): " + error.message);
    });
  }

  // HIỂN THỊ DANH SÁCH THIẾT BỊ
  function renderDevices() {
    const tbody = document.getElementById("device-table-body");
    const filterValue = document.getElementById("groupFilter").value;
    tbody.innerHTML = "";

    if (!globalDeviceData) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding:30px;">Chưa có thiết bị nào trong cơ sở dữ liệu.</td></tr>';
      return;
    }

    let count = 0;
    for (let id in globalDeviceData) {
      let dev = globalDeviceData[id];
      let devGroup = dev.group || "Chưa Phân Nhóm";

      if (filterValue !== "ALL" && devGroup !== filterValue) continue;

      count++;
      let devName = dev.device_name || ("TRAM_" + id.substring(id.length - 4));
      let macAddr = dev.mac || id;
      let fwVer   = dev.firmware || "1.0.0";

      let row = `<tr>
        <td><b style="color: var(--text-main);">${devName}</b></td>
        <td><span class="badge-group">${devGroup}</span></td>
        <td><span class="badge-mac">${macAddr}</span></td>
        <td><span class="badge-fw">v${fwVer}</span></td>
        <td>
          <div class="action-group">
            <button class="btn-edit" onclick="openEditModal('${id}', '${devName}', '${devGroup}')"><i class="fa-solid fa-pen"></i> Sửa</button>
            <button class="btn-delete" onclick="deleteDevice('${id}', '${devName}')"><i class="fa-solid fa-trash-can"></i> Xóa</button>
          </div>
        </td>
      </tr>`;
      tbody.innerHTML += row;
    }

    if (count === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding:30px;">Không tìm thấy thiết bị phù hợp.</td></tr>';
    }
  }

  function updateGroupDropdown(data) {
    const filterSelect = document.getElementById("groupFilter");
    const currentSelected = filterSelect.value;
    
    let groups = new Set();
    for (let id in data) {
      groups.add(data[id].group || "Chưa Phân Nhóm");
    }

    let optionsHTML = '<option value="ALL">-- Tất cả nhóm --</option>';
    groups.forEach(g => { optionsHTML += `<option value="${g}">${g}</option>`; });
    filterSelect.innerHTML = optionsHTML;
    filterSelect.value = groups.has(currentSelected) || currentSelected === "ALL" ? currentSelected : "ALL";
  }

  function openEditModal(deviceId, currentName, currentGroup) {
    document.getElementById("editDeviceId").value = deviceId;
    document.getElementById("editDeviceName").value = currentName;
    document.getElementById("editGroupName").value = currentGroup;
    document.getElementById("editModal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("editModal").style.display = "none";
  }

  function saveDeviceChanges() {
    const deviceId = document.getElementById("editDeviceId").value;
    const newName = document.getElementById("editDeviceName").value.trim();
    const newGroup = document.getElementById("editGroupName").value.trim() || "Chưa Phân Nhóm";

    if (!newName) return alert("Vui lòng nhập tên trạm!");

    db.ref("devices/" + deviceId).update({
      device_name: newName,
      group: newGroup
    }).then(() => {
      alert("Cập nhật thành công!");
      closeModal();
    }).catch(err => alert("Lỗi khi lưu: " + err.message));
  }

  function deleteDevice(deviceId, deviceName) {
    if (confirm(`Xóa thiết bị "${deviceName}"?`)) {
      db.ref("devices/" + deviceId).remove()
        .then(() => alert(`Đã xóa "${deviceName}"!`))
        .catch(err => alert("Lỗi khi xóa: " + err.message));
    }
  }
</script>

</body>
</html>

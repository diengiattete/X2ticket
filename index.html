<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giám Sát Thiết Bị X2 Realtime</title>
  
  <!-- Tailwind CSS cho Giao diện -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase JS SDK (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-xl shadow-md border-b-4 border-blue-600">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Hệ Thống Giám Sát X2 Realtime</h1>
        <p class="text-sm text-gray-500 mt-1">Đồng bộ dữ liệu phát xung song song qua Firebase</p>
      </div>
      <div class="mt-4 md:mt-0 flex items-center space-x-2">
        <span class="text-sm font-semibold text-gray-600">Trạng thái hệ thống:</span>
        <span id="system-status" class="px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700">HOẠT ĐỘNG</span>
      </div>
    </header>

    <!-- Thống Kê Tổng Quan / Danh Sách Thiết Bị -->
    <div id="devices-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Thẻ thiết bị sẽ được render tự động ở đây -->
      <div class="col-span-full text-center py-12 text-gray-400">
        Đang tải dữ liệu thiết bị...
      </div>
    </div>
  </div>

  <script>
    // 1. CẤU HÌNH FIREBASE DATABASE CỦA BẠN
    const firebaseConfig = {
      databaseURL: "https://trungio.firebaseio.com"
    };

    // Khởi tạo Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Hằng số thời gian chờ Offline (30 giây)
    const OFFLINE_TIMEOUT_MS = 30000;
    
    // Lưu trữ local trạng thái các thiết bị để loop kiểm tra
    let localDevicesData = {};

    // 2. LẮNG NGHE DỮ LIỆU REALTIME TỪ FIREBASE
    db.ref('/devices').on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        document.getElementById('devices-container').innerHTML = `
          <div class="col-span-full text-center py-12 text-gray-400">
            Chưa có dữ liệu thiết bị nào trong Database.
          </div>`;
        return;
      }

      localDevicesData = data;
      renderDevices();
    });

    // 3. HÀM RENDER GIAO DIỆN THIẾT BỊ
    function renderDevices() {
      const container = document.getElementById('devices-container');
      container.innerHTML = '';

      const currentTime = Date.now();

      Object.keys(localDevicesData).forEach((mac) => {
        const device = localDevicesData[mac];
        const lastSeen = device.last_seen || 0;
        const timeDiff = currentTime - lastSeen;

        // Tính toán trạng thái ONLINE / OFFLINE (>30s không có tin = OFFLINE)
        const isOnline = timeDiff <= OFFLINE_TIMEOUT_MS;
        const statusText = isOnline ? "ONLINE" : "OFFLINE";
        const statusClass = isOnline 
          ? "bg-green-100 text-green-800 border-green-300" 
          : "bg-red-100 text-red-800 border-red-300";
        const statusDot = isOnline ? "bg-green-500 animate-pulse" : "bg-red-500";

        // Định dạng thời gian
        const lastSeenFormatted = lastSeen > 0 
          ? new Date(lastSeen).toLocaleTimeString('vi-VN') 
          : 'Chưa có dữ liệu';

        const cardHtml = `
          <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200 transition-all duration-300 hover:shadow-lg">
            <!-- Header Card -->
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50">
              <div>
                <h3 class="font-bold text-lg text-gray-800">MAC: ${mac}</h3>
                <p class="text-xs text-gray-500">Firmware: v${device.firmware || '1.0.0'} | IP: ${device.ip || '0.0.0.0'}</p>
              </div>
              <div class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full border text-xs font-bold ${statusClass}">
                <span class="w-2 h-2 rounded-full ${statusDot}"></span>
                <span>${statusText}</span>
              </div>
            </div>

            <!-- Body Card - Số Liệu Xung -->
            <div class="p-5 grid grid-cols-2 gap-4">
              <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                <span class="text-xs text-blue-600 font-semibold uppercase">Xung Vào (IN)</span>
                <p class="text-2xl font-black text-blue-900 mt-1">${(device.input_count || 0).toLocaleString()}</p>
              </div>

              <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-100">
                <span class="text-xs text-indigo-600 font-semibold uppercase">Xung Ra (OUT)</span>
                <p class="text-2xl font-black text-indigo-900 mt-1">${(device.output_count || 0).toLocaleString()}</p>
              </div>

              <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                <span class="text-xs text-gray-500 font-semibold uppercase">Tỷ Lệ (Ratio)</span>
                <p class="text-xl font-bold text-gray-800 mt-1">${device.ratio || '0.00'}</p>
              </div>

              <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                <span class="text-xs text-gray-500 font-semibold uppercase">Tín Hiệu Wi-Fi</span>
                <p class="text-xl font-bold text-gray-800 mt-1">${device.wifi_signal || 0} dBm</p>
              </div>
            </div>

            <!-- Footer Card -->
            <div class="px-5 py-3 bg-gray-50 border-t border-gray-100 flex justify-between items-center text-xs text-gray-500">
              <span>Nửa chu kỳ: <strong>${device.pulse_width_us || 0} µs</strong></span>
              <span>Lần cuối: <strong>${lastSeenFormatted}</strong></span>
            </div>
          </div>
        `;

        container.innerHTML += cardHtml;
      });
    }

    // 4. VÒNG LẶP KIỂM TRA OVERTIME (CẬP NHẬT TRẠNG THÁI OFFLINE MỖI 3 GIÂY)
    // Giúp giao diện chuyển ngay sang OFFLINE khi quá 30s mà không cần đợt sync mới từ Firebase
    setInterval(() => {
      if (Object.keys(localDevicesData).length > 0) {
        renderDevices();
      }
    }, 3000);
  </script>
</body>
</html>

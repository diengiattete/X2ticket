<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>theo dõi funchomper</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-yellow: #facc15;
      --accent-red: #f87171;
      --border-color: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; padding: 24px; }
    .container { max-width: 1000px; margin: 0 auto; display: none; }

    /* Login Screen Style */
    .login-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .login-box {
      background: var(--bg-surface);
      padding: 32px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    .login-box h2 { font-size: 20px; color: var(--accent-blue); margin-bottom: 8px; text-transform: uppercase; }
    .login-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
    
    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }
    .form-input:focus { border-color: var(--accent-blue); }

    .btn-login, .btn-primary, .btn-cancel {
      padding: 10px 18px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .btn-login { width: 100%; background: var(--accent-blue); color: #000; }
    .btn-primary { background: var(--accent-blue); color: #000; }
    .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }
    .btn-login:hover, .btn-primary:hover { opacity: 0.9; }

    /* Navbar & Header */
    .navbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
    .navbar h1 { font-size: 20px; color: var(--accent-blue); display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
    .nav-controls { display: flex; align-items: center; gap: 12px; }
    .status-badge { background: rgba(74, 222, 128, 0.1); padding: 6px 12px; border-radius: 20px; color: var(--accent-green); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .btn-logout { background: rgba(248, 113, 113, 0.1); color: var(--accent-red); border: 1px solid rgba(248, 113, 113, 0.3); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }

    /* Main Table Card */
    .card { background: var(--bg-surface); border-radius: 10px; border: 1px solid var(--border-color); padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .card-title { font-size: 16px; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 8px; }

    /* Filter Controls */
    .filter-box { display: flex; align-items: center; gap: 8px; }
    .filter-box select { background: var(--bg-primary); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; font-size: 13px; outline: none; }

    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: var(--bg-primary); padding: 12px 14px; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); text-transform: uppercase; letter-spacing: 0.5px; }
    td { padding: 14px; border-bottom: 1px solid var(--border-color); font-size: 14px; vertical-align: middle; }

    .badge-mac { font-family: monospace; background: var(--bg-primary); color: var(--accent-blue); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border-color); font-size: 13px; }
    .badge-fw { background: rgba(74, 222, 128, 0.15); color: var(--accent-green); padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 13px; }
    .badge-group { background: rgba(56, 189, 248, 0.15); color: var(--accent-blue); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid rgba(56, 189, 248, 0.3); }

    .action-group { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-edit, .btn-delete { border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn-edit { background: rgba(250, 204, 21, 0.1); color: var(--accent-yellow); border: 1px solid rgba(250, 204, 21, 0.3); }
    .btn-edit:hover { background: var(--accent-yellow); color: #000; }
    .btn-delete { background: rgba(248, 113, 113, 0.1); color: var(--accent-red); border: 1px solid rgba(248, 113, 113, 0.3); }
    .btn-delete:hover { background: var(--accent-red); color: #fff; }

    /* Modal Chỉnh Sửa */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-box {
      background: var(--bg-surface);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-header { font-size: 16px; font-weight: bold; color: var(--accent-blue); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--accent-yellow); cursor: pointer; }
  </style>
</head>
<body>

<!-- 1. Màn hình đăng nhập -->
<div class="login-overlay" id="loginScreen">
  <div class="login-box">
    <h2><i class="fa-solid fa-shield-halved"></i> THEO DÕI FUNCHOMPER</h2>
    <p>Vui lòng nhập mật khẩu quản trị hệ thống</p>
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="password">Mật Khẩu</label>
        <input type="password" id="password" class="form-input" placeholder="Nhập mật khẩu..." autocomplete="off" required autofocus>
      </div>
      <button type="submit" class="btn-login">ĐĂNG NHẬP</button>
    </form>
  </div>
</div>

<!-- 2. Màn hình Dashboard -->
<div class="container" id="dashboardScreen">
  <div class="navbar">
    <h1><i class="fa-solid fa-microchip"></i> THEO DÕI FUNCHOMPER</h1>
    <div class="nav-controls">
      <div class="status-badge"><i class="fa-solid fa-circle" style="font-size:8px;"></i> Firebase Live</div>
      <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Thoát</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title"><i class="fa-solid fa-server"></i> Danh Sách Thiết Bị Theo Nhóm</div>
      <div class="filter-box">
        <label style="font-size:13px; color:var(--text-muted);"><i class="fa-solid fa-filter"></i> Lọc Nhóm:</label>
        <select id="groupFilter" onchange="renderDevices()">
          <option value="ALL">-- Tất cả các nhóm --</option>
        </select>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Tên Trạm</th>
            <th>Nhóm / Trung Tâm</th>
            <th>Địa Chỉ MAC</th>
            <th>Phiên Bản FW</th>
            <th style="text-align: right;">Thao Tác</th>
          </tr>
        </thead>
        <tbody id="device-table-body">
          <tr><td colspan="5" style="text-align:center; color: var(--text-muted);">Đang kết nối Firebase...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 3. Popup Bảng Chỉnh Sửa Thông Tin -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-header">
      <span><i class="fa-solid fa-pen-to-square"></i> Cập Nhật Thông Tin Trạm</span>
      <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal()"></i>
    </div>
    
    <input type="hidden" id="editDeviceId">
    <input type="hidden" id="oldGroupName">

    <div class="form-group">
      <label for="editDeviceName">Tên Trạm / Thiết Bị</label>
      <input type="text" id="editDeviceName" class="form-input" placeholder="Nhập tên trạm...">
    </div>

    <div class="form-group">
      <label for="editGroupName">Tên Nhóm / Trung Tâm</label>
      <input type="text" id="editGroupName" class="form-input" placeholder="Nhập tên nhóm mới...">
      
      <label class="checkbox-group">
        <input type="checkbox" id="applyGroupToAll"> 
        <span>Đổi tên nhóm này cho <b>TẤT CẢ</b> thiết bị thuộc nhóm cũ</span>
      </label>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Hủy</button>
      <button class="btn-primary" onclick="saveDeviceChanges()">Lưu Thay Đổi</button>
    </div>
  </div>
</div>

<!-- Firebase SDK v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  const ADMIN_PASSWORD = "88888888";

  const firebaseConfig = {
    databaseURL: "https://trungio.firebaseio.com"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let globalDeviceData = null;

  function handleLogin(e) {
    e.preventDefault();
    const pwdInput = document.getElementById("password").value;
    if (pwdInput === ADMIN_PASSWORD) {
      sessionStorage.setItem("funchomper_authenticated", "true");
      showDashboard();
    } else {
      alert("Mật khẩu không chính xác!");
    }
  }

  function showDashboard() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("dashboardScreen").style.display = "block";
  }

  function logout() {
    sessionStorage.removeItem("funchomper_authenticated");
    location.reload();
  }

  if (sessionStorage.getItem("funchomper_authenticated") === "true") {
    showDashboard();
  }

  // --- QUẢN LÝ MODAL POPUP ---
  function openEditModal(deviceId, currentName, currentGroup) {
    document.getElementById("editDeviceId").value = deviceId;
    document.getElementById("oldGroupName").value = currentGroup;
    document.getElementById("editDeviceName").value = currentName;
    document.getElementById("editGroupName").value = currentGroup;
    document.getElementById("applyGroupToAll").checked = false;

    document.getElementById("editModal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("editModal").style.display = "none";
  }

  function saveDeviceChanges() {
    const deviceId = document.getElementById("editDeviceId").value;
    const oldGroup = document.getElementById("oldGroupName").value;
    const newName = document.getElementById("editDeviceName").value.trim();
    const newGroup = document.getElementById("editGroupName").value.trim() || "Chưa Phân Nhóm";
    const applyToAll = document.getElementById("applyGroupToAll").checked;

    if (!newName) {
      alert("Vui lòng nhập tên trạm!");
      return;
    }

    if (applyToAll && oldGroup && oldGroup !== "Chưa Phân Nhóm") {
      // Cập nhật tên nhóm hàng loạt cho tất cả thiết bị thuộc nhóm cũ
      let updates = {};
      for (let id in globalDeviceData) {
        let devGrp = globalDeviceData[id].group || "Chưa Phân Nhóm";
        if (devGrp === oldGroup) {
          updates["devices/" + id + "/group"] = newGroup;
        }
      }
      updates["devices/" + deviceId + "/device_name"] = newName;

      db.ref().update(updates)
        .then(() => {
          alert(`Đã đổi tên nhóm từ "${oldGroup}" sang "${newGroup}" cho toàn bộ thiết bị liên quan!`);
          closeModal();
        })
        .catch(err => alert("Lỗi khi cập nhật hàng loạt: " + err.message));
    } else {
      // Chỉ cập nhật cho riêng thiết bị này
      db.ref("devices/" + deviceId).update({
        device_name: newName,
        group: newGroup
      })
      .then(() => {
        alert("Cập nhật thông tin thành công!");
        closeModal();
      })
      .catch(err => alert("Lỗi khi lưu: " + err.message));
    }
  }

  function deleteDevice(deviceId, deviceName) {
    if (confirm(`Bạn có chắc chắn muốn XÓA thiết bị "${deviceName}" khỏi hệ thống?`)) {
      db.ref("devices/" + deviceId).remove()
        .then(() => alert(`Đã xóa thiết bị "${deviceName}"!`))
        .catch((err) => alert("Lỗi khi xóa: " + err.message));
    }
  }

  function renderDevices() {
    const tbody = document.getElementById("device-table-body");
    const filterValue = document.getElementById("groupFilter").value;
    tbody.innerHTML = "";

    if (!globalDeviceData) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted);">Chưa có thiết bị nào trong hệ thống.</td></tr>';
      return;
    }

    let count = 0;
    for (let id in globalDeviceData) {
      let dev = globalDeviceData[id];
      let devGroup = dev.group || "Chưa Phân Nhóm";

      if (filterValue !== "ALL" && devGroup !== filterValue) {
        continue;
      }

      count++;
      let defaultName = "TRAM_" + id.substring(id.length - 4);
      let devName = dev.device_name || defaultName;
      let macAddr = dev.mac || id;
      let fwVer   = dev.firmware || "1.0.0";

      let row = `<tr>
        <td><b style="font-size: 15px; color: var(--text-main);">${devName}</b></td>
        <td><span class="badge-group"><i class="fa-solid fa-layer-group"></i> ${devGroup}</span></td>
        <td><span class="badge-mac">${macAddr}</span></td>
        <td><span class="badge-fw">v${fwVer}</span></td>
        <td>
          <div class="action-group">
            <button class="btn-edit" onclick="openEditModal('${id}', '${devName}', '${devGroup}')">
              <i class="fa-solid fa-pen"></i> Sửa
            </button>
            <button class="btn-delete" onclick="deleteDevice('${id}', '${devName}')">
              <i class="fa-solid fa-trash-can"></i> Xóa
            </button>
          </div>
        </td>
      </tr>`;
      tbody.innerHTML += row;
    }

    if (count === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted);">Không tìm thấy thiết bị thuộc nhóm này.</td></tr>';
    }
  }

  function updateGroupDropdown(data) {
    const filterSelect = document.getElementById("groupFilter");
    const currentSelected = filterSelect.value;
    
    let groups = new Set();
    for (let id in data) {
      groups.add(data[id].group || "Chưa Phân Nhóm");
    }

    let optionsHTML = '<option value="ALL">-- Tất cả các nhóm --</option>';
    groups.forEach(g => {
      optionsHTML += `<option value="${g}">${g}</option>`;
    });

    filterSelect.innerHTML = optionsHTML;
    if ([...groups].includes(currentSelected) || currentSelected === "ALL") {
      filterSelect.value = currentSelected;
    } else {
      filterSelect.value = "ALL";
    }
  }

  db.ref("devices").on("value", (snapshot) => {
    globalDeviceData = snapshot.val();
    if (globalDeviceData) {
      updateGroupDropdown(globalDeviceData);
    }
    renderDevices();
  });
</script>

</body>
</html>

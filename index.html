<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Điều Khiển Quản Trị</title>
  <style>
    /* --- CSS Reset & Base Styles (Dark Mode) --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a; /* Nền tối chính */
      color: #f8fafc; /* Chữ sáng */
      display: flex;
      min-height: 100vh;
    }

    /* --- Sidebar --- */
    .sidebar {
      width: 250px;
      background-color: #1e293b;
      border-right: 1px solid #334155;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sidebar nav a {
      color: #94a3b8;
      text-decoration: none;
      display: block;
      padding: 12px 15px;
      border-radius: 6px;
      margin-bottom: 8px;
      transition: all 0.3s ease;
    }

    .sidebar nav a:hover, .sidebar nav a.active {
      background-color: #0284c7;
      color: #fff;
    }

    /* --- Main Content --- */
    .main-content {
      flex: 1;
      padding: 30px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      background: #1e293b;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-bottom: 25px;
    }

    .card h3 {
      margin-bottom: 20px;
      color: #38bdf8;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }

    /* --- Form Styles --- */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    .form-group input, .form-group select {
      padding: 10px 12px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      outline: none;
      font-size: 0.95rem;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #38bdf8;
    }

    .btn {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #0369a1;
    }

    .btn-danger {
      background-color: #ef4444;
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }

    /* --- Table Styles --- */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #334155;
    }

    th {
      background-color: #0f172a;
      color: #94a3b8;
      font-weight: 600;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-admin {
      background-color: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border: 1px solid #38bdf8;
    }

    .badge-user {
      background-color: rgba(148, 163, 184, 0.2);
      color: #94a3b8;
      border: 1px solid #94a3b8;
    }
  </style>
</head>
<body>

  <!-- Thanh Điều Hướng Bên (Sidebar) -->
  <aside class="sidebar">
    <h2>Admin Dashboard</h2>
    <nav>
      <a href="#" class="active">Quản lý Người dùng</a>
      <a href="#">Cấu hình Hệ thống</a>
      <a href="#">Nhật ký Hoạt động</a>
    </nav>
  </aside>

  <!-- Khu Vực Nội Dung Chính -->
  <main class="main-content">
    <header>
      <h1>Quản Lý Hệ Thống</h1>
      <div class="user-profile">
        <span>Xin chào, <strong>Admin</strong></span>
      </div>
    </header>

    <!-- CARD 1: FORM TẠO NGƯỜI DÙNG MỚI (User & Mật khẩu) -->
    <section class="card">
      <h3>Tạo Người Dùng Mới</h3>
      <form id="createUserForm" onsubmit="handleCreateUser(event)">
        <div class="form-grid">
          <div class="form-group">
            <label for="username">Tên người dùng (User)</label>
            <input type="text" id="username" placeholder="Nhập tên tài khoản" required autocomplete="off">
          </div>

          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu" required minlength="4">
          </div>

          <div class="form-group">
            <label for="userRole">Vai trò</label>
            <select id="userRole">
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn">Tạo Tài Khoản</button>
      </form>
    </section>

    <!-- CARD 2: DANH SÁCH NGƯỜI DÙNG -->
    <section class="card">
      <h3>Danh Sách Tài Khoản</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Tên Tài Khoản</th>
            <th>Vai Trò</th>
            <th>Thao Tác</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <!-- Dữ liệu mẫu -->
          <tr>
            <td>1</td>
            <td>admin_root</td>
            <td><span class="badge badge-admin">ADMIN</span></td>
            <td><button class="btn btn-danger" onclick="deleteUser(1)">Xóa</button></td>
          </tr>
          <tr>
            <td>2</td>
            <td>operator_01</td>
            <td><span class="badge badge-user">USER</span></td>
            <td><button class="btn btn-danger" onclick="deleteUser(2)">Xóa</button></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <!-- LOGIC XỬ LÝ JAVASCRIPT -->
  <script>
    // Hàm xử lý tạo User mới
    async function handleCreateUser(event) {
      event.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('userRole').value;

      try {
        // Gửi thông tin tới Server/API của bạn ở đây
        /*
        const response = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, role })
        });
        */

        // Giả lập thêm dữ liệu vào giao diện bảng để xem thử:
        alert(`Tạo thành công tài khoản: ${username}`);
        addUserToTable(Date.now(), username, role);

        // Reset form sau khi tạo
        document.getElementById('createUserForm').reset();

      } catch (error) {
        console.error('Lỗi khi tạo user:', error);
        alert('Đã xảy ra lỗi, vui lòng thử lại.');
      }
    }

    // Hàm thêm user vừa tạo vào bảng hiển thị
    function addUserToTable(id, username, role) {
      const tbody = document.getElementById('userTableBody');
      const tr = document.createElement('tr');
      const roleBadge = role === 'admin' ? 'badge-admin' : 'badge-user';
      
      tr.innerHTML = `
        <td>${id}</td>
        <td>${username}</td>
        <td><span class="badge ${roleBadge}">${role.toUpperCase()}</span></td>
        <td><button class="btn btn-danger" onclick="deleteUser(${id})">Xóa</button></td>
      `;
      tbody.appendChild(tr);
    }

    // Hàm xóa user
    function deleteUser(id) {
      if (confirm(`Bạn có chắc chắn muốn xóa tài khoản có ID: ${id}?`)) {
        // Thực hiện xóa dòng trên bảng giao diện
        event.target.closest('tr').remove();
      }
    }
  </script>
</body>
</html>

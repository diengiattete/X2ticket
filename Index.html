<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Theo Dõi Funchomper - Dashboard</title>
  
  <!-- FontAwesome Icons & Google Font (Inter) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-body: #090d16;
      --bg-surface: rgba(22, 30, 46, 0.85);
      --bg-card: rgba(30, 41, 59, 0.6);
      --bg-input: rgba(15, 23, 42, 0.9);
      
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      
      --accent-blue: #38bdf8;
      --accent-blue-glow: rgba(56, 189, 248, 0.25);
      --accent-green: #34d399;
      --accent-yellow: #fbbf24;
      --accent-red: #f87171;
      
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(56, 189, 248, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    
    body { 
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg-body) 75%);
      color: var(--text-main); 
      min-height: 100vh; 
      padding: 16px 8px; 
    }
    
    .container { max-width: 1100px; margin: 0 auto; display: none; }

    /* Màn hình đăng nhập Glassmorphism */
    .login-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 16px;
    }
    .login-box {
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 32px 20px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.1);
      text-align: center;
    }
    .login-box .icon-logo {
      font-size: 36px;
      color: var(--accent-blue);
      margin-bottom: 12px;
      filter: drop-shadow(0 0 8px var(--accent-blue-glow));
    }
    .login-box h2 { font-size: 18px; font-weight: 700; color: var(--text-main); letter-spacing: 0.5px; margin-bottom: 6px; }
    .login-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
    
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.25s ease;
    }
    .form-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 12px var(--accent-blue-glow); }

    .btn-login, .btn-primary, .btn-cancel {
      padding: 12px 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .btn-login { 
      width: 100%; 
      margin-top: 8px;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); 
      color: #fff; 
      box-shadow: 0 4px 15px var(--accent-blue-glow);
    }
    .btn-primary { 
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); 
      color: #fff; 
    }
    .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }

    /* Navbar Header */
    .navbar { 
      display: flex; 
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px; 
      padding-bottom: 16px; 
      border-bottom: 1px solid var(--border-color); 
    }
    .navbar h1 { 
      font-size: 18px; 
      font-weight: 700; 
      color: var(--text-main); 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      letter-spacing: -0.3px;
    }
    .navbar h1 i { color: var(--accent-blue); filter: drop-shadow(0 0 6px var(--accent-blue-glow)); }
    
    .nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; width: 100%; }
    
    /* Role Badge */
    .role-badge {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .role-admin { background: rgba(251, 191, 36, 0.15); color: var(--accent-yellow); border: 1px solid rgba(251, 191, 36, 0.3); }
    .role-user { background: rgba(56, 189, 248, 0.15); color: var(--accent-blue); border: 1px solid rgba(56, 189, 248, 0.3); }

    /* Nút Quản Lý Nav */
    .btn-action-nav {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-logout { 
      background: rgba(248, 113, 113, 0.08); 
      color: var(--accent-red); 
      border: 1px solid rgba(248, 113, 113, 0.25); 
      padding: 6px 12px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 12px; 
      font-weight: 500; 
      margin-left: auto;
    }

    /* Bảng hiển thị chính */
    .card { 
      background: var(--bg-surface); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 14px; 
      border: 1px solid var(--border-color); 
      padding: 16px 12px; 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); 
    }
    .card-header { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 16px; gap: 12px; }
    .card-title { font-size: 15px; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
    .card-title i { color: var(--accent-blue); }

    /* Bộ lọc nhóm Mobile */
    .filter-box { display: flex; align-items: center; gap: 8px; width: 100%; }
    .filter-box select { 
      width: 100%;
      background: var(--bg-input); 
      color: var(--text-main); 
      border: 1px solid var(--border-color); 
      padding: 8px 12px; 
      border-radius: 8px; 
      font-size: 13px; 
      outline: none; 
    }

    .table-container { 
      overflow-x: auto; 
      -webkit-overflow-scrolling: touch; 
      border-radius: 8px; 
    }
    table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: left; min-width: 550px; }
    th { 
      background: rgba(15, 23, 42, 0.7); 
      padding: 10px 12px; 
      font-size: 11px; 
      font-weight: 600; 
      color: var(--text-muted); 
      border-bottom: 1px solid var(--border-color); 
      text-transform: uppercase; 
    }

    td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 13px; vertical-align: middle; }

    .badge-mac { 
      font-family: 'Consolas', monospace; 
      background: rgba(15, 23, 42, 0.8); 
      color: var(--accent-blue); 
      padding: 3px 6px; 
      border-radius: 4px; 
      border: 1px solid var(--border-color); 
      font-size: 11px; 
    }
    .badge-fw { 
      background: rgba(52, 211, 153, 0.1); 
      color: var(--accent-green); 
      padding: 3px 6px; 
      border-radius: 4px; 
      font-weight: 600; 
      font-size: 11px; 
    }
    .badge-group { 
      background: rgba(56, 189, 248, 0.1); 
      color: var(--accent-blue); 
      padding: 3px 8px; 
      border-radius: 12px; 
      font-size: 11px; 
      font-weight: 500; 
    }

    .action-group { display: flex; gap: 6px; justify-content: flex-end; }
    .btn-edit, .btn-delete { 
      border-radius: 6px; 
      padding: 6px 10px; 
      cursor: pointer; 
      font-size: 11px; 
      font-weight: 500; 
      display: inline-flex; 
      align-items: center; 
      gap: 4px; 
    }
    .btn-edit { background: rgba(251, 191, 36, 0.1); color: var(--accent-yellow); border: 1px solid rgba(251, 191, 36, 0.25); }
    .btn-delete { background: rgba(248, 113, 113, 0.1); color: var(--accent-red); border: 1px solid rgba(248, 113, 113, 0.25); }

    /* Modal Popup Glassmorphism Mobile */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 8, 17, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 12px;
    }
    .modal-box {
      background: var(--bg-surface);
      padding: 20px 16px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header { font-size: 15px; font-weight: 600; color: var(--text-main); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--accent-yellow); cursor: pointer; }
    .checkbox-group input { accent-color: var(--accent-yellow); width: 16px; height: 16px; }

    /* Tối ưu hóa cho màn hình máy tính / Tablet rộng hơn */
    @media (min-width: 640px) {
      body { padding: 32px 16px; }
      .navbar { flex-direction: row; justify-content: space-between; align-items: center; }
      .card-header { flex-direction: row; justify-content: space-between; align-items: center; }
      .filter-box { width: auto; }
      .btn-logout { margin-left: 0; }
    }
  </style>
</head>
<body>

<!-- 1. Màn hình đăng nhập (TÊN ĐĂNG NHẬP + MẬT KHẨU) -->
<div class="login-overlay" id="loginScreen">
  <div class="login-box">
    <div class="icon-logo"><i class="fa-solid fa-shield-halved"></i></div>
    <h2>FUNCHOMPER CONTROL</h2>
    <p>Đăng nhập hệ thống quản lý</p>
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Tên Đăng Nhập</label>
        <input type="text" id="username" class="form-input" placeholder="Nhập tên đăng nhập..." required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Mật Khẩu</label>
        <input type="password" id="password" class="form-input" placeholder="Nhập mật khẩu..." required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">ĐĂNG NHẬP</button>
    </form>
  </div>
</div>

<!-- 2. Màn hình Dashboard -->
<div class="container" id="dashboardScreen">
  <div class="navbar">
    <h1><i class="fa-solid fa-microchip"></i> FUNCHOMPER</h1>
    <div class="nav-controls">
      <div id="roleBadge" class="role-badge role-user">User</div>
      
      <!-- Nút dành riêng cho Admin -->
      <button id="btnPassManage" class="btn-action-nav" onclick="openPassModal()" style="display: none;">
        <i class="fa-solid fa-user-plus"></i> <span class="nav-btn-text">User</span>
      </button>

      <button id="btnChangeAdminPass" class="btn-action-nav" onclick="openChangeAdminPassModal()" style="display: none;">
        <i class="fa-solid fa-user-gear"></i> <span class="nav-btn-text">Admin</span>
      </button>

      <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Thoát</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title"><i class="fa-solid fa-server"></i> Danh Sách Thiết Bị</div>
      <div class="filter-box">
        <select id="groupFilter" onchange="renderDevices()">
          <option value="ALL">-- Tất cả nhóm --</option>
        </select>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Tên Trạm</th>
            <th>Nhóm</th>
            <th>Địa Chỉ MAC</th>
            <th>FW</th>
            <th style="text-align: right;">Thao Tác</th>
          </tr>
        </thead>
        <tbody id="device-table-body">
          <tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding: 30px;">Đang kết nối dữ liệu Firebase...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 3. Popup Sửa Tên Trạm / Nhóm -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-header">
      <span><i class="fa-solid fa-pen-to-square" style="color:var(--accent-blue); margin-right:6px;"></i> Cập Nhật Trạm</span>
      <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal()"></i>
    </div>
    
    <input type="hidden" id="editDeviceId">
    <input type="hidden" id="oldGroupName">

    <div class="form-group">
      <label for="editDeviceName">Tên Trạm / Thiết Bị</label>
      <input type="text" id="editDeviceName" class="form-input" placeholder="Nhập tên trạm...">
    </div>

    <div class="form-group">
      <label for="editGroupName">Tên Nhóm / Trung Tâm</label>
      <input type="text" id="editGroupName" class="form-input" placeholder="Nhập tên nhóm mới...">
      
      <label class="checkbox-group">
        <input type="checkbox" id="applyGroupToAll"> 
        <span>Đổi tên nhóm này cho <b>TẤT CẢ</b> trạm thuộc nhóm cũ</span>
      </label>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Hủy</button>
      <button class="btn-primary" onclick="saveDeviceChanges()">Lưu Thay Đổi</button>
    </div>
  </div>
</div>

<!-- 4. Popup Admin Tạo & Quản Lý User -->
<div class="modal-overlay" id="passModal">
  <div class="modal-box">
    <div class="modal-header">
      <span><i class="fa-solid fa-user-plus" style="color:var(--accent-blue); margin-right:6px;"></i> Quản Lý Tài Khoản User</span>
      <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closePassModal()"></i>
    </div>

    <form id="createPassForm" onsubmit="handleCreatePass(event)">
      <div class="form-group">
        <label for="newUserNote">Ghi Chú / Người Dùng</label>
        <input type="text" id="newUserNote" class="form-input" placeholder="VD: Anh Nam kỹ thuật..." required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="newUsername">Tên Đăng Nhập User</label>
        <input type="text" id="newUsername" class="form-input" placeholder="Nhập username..." required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="newPassVal">Mật Khẩu User</label>
        <input type="text" id="newPassVal" class="form-input" placeholder="Nhập pass..." required minlength="4">
      </div>
      <button type="submit" class="btn-primary" style="width: 100%;">TẠO TÀI KHOẢN</button>
    </form>

    <hr style="border-color: var(--border-color); margin: 16px 0;">

    <div style="font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 10px;">Danh Sách User Đang Có</div>
    <div class="table-container">
      <table style="min-width: 100%;">
        <thead>
          <tr>
            <th>Ghi Chú</th>
            <th>Username</th>
            <th>Mật Khẩu</th>
            <th style="text-align: right;">Xóa</th>
          </tr>
        </thead>
        <tbody id="pass-table-body">
          <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Đang tải...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 5. Popup Admin Tự Đổi Tên Đăng Nhập & Pass Của Mình -->
<div class="modal-overlay" id="changeAdminPassModal">
  <div class="modal-box">
    <div class="modal-header">
      <span><i class="fa-solid fa-user-gear" style="color:var(--accent-yellow); margin-right:6px;"></i> Cập Nhật Admin</span>
      <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeChangeAdminPassModal()"></i>
    </div>

    <form onsubmit="handleChangeAdminPass(event)">
      <div class="form-group">
        <label for="newAdminUser">Tên Đăng Nhập Admin Mới</label>
        <input type="text" id="newAdminUser" class="form-input" placeholder="Username Admin mới..." required>
      </div>
      <div class="form-group">
        <label for="currentAdminPass">Mật Khẩu Admin Hiện Tại</label>
        <input type="password" id="currentAdminPass" class="form-input" placeholder="Pass hiện tại..." required>
      </div>
      <div class="form-group">
        <label for="newAdminPass">Mật Khẩu Admin Mới</label>
        <input type="password" id="newAdminPass" class="form-input" placeholder="Pass mới..." required minlength="4">
      </div>
      <div class="form-group">
        <label for="confirmAdminPass">Xác Nhận Mật Khẩu Mới</label>
        <input type="password" id="confirmAdminPass" class="form-input" placeholder="Nhập lại pass mới..." required minlength="4">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-cancel" onclick="closeChangeAdminPassModal()">Hủy</button>
        <button type="submit" class="btn-primary">LƯU CẬP NHẬT</button>
      </div>
    </form>
  </div>
</div>

<!-- Firebase SDK v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  const DEFAULT_ADMIN_USER = "admin";
  const DEFAULT_ADMIN_PASS = "88888888";

  const firebaseConfig = {
    databaseURL: "https://trungio.firebaseio.com"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let globalDeviceData = null;
  let globalPassData = null;
  let currentAdminUser = DEFAULT_ADMIN_USER;
  let currentAdminPass = DEFAULT_ADMIN_PASS;

  db.ref("admin_settings").on("value", (snapshot) => {
    if (snapshot.exists()) {
      const data = snapshot.val();
      currentAdminUser = data.admin_username || DEFAULT_ADMIN_USER;
      currentAdminPass = data.admin_password || DEFAULT_ADMIN_PASS;
    } else {
      currentAdminUser = DEFAULT_ADMIN_USER;
      currentAdminPass = DEFAULT_ADMIN_PASS;
    }
  });

  function handleLogin(e) {
    e.preventDefault();
    const userInput = document.getElementById("username").value.trim();
    const pwdInput = document.getElementById("password").value.trim();

    if (userInput === currentAdminUser && pwdInput === currentAdminPass) {
      sessionStorage.setItem("funchomper_authenticated", "true");
      sessionStorage.setItem("funchomper_role", "ADMIN");
      sessionStorage.setItem("funchomper_user", userInput);
      showDashboard();
      return;
    }

    db.ref("access_passwords").once("value").then((snapshot) => {
      const passData = snapshot.val();
      let isValidUser = false;
      let loggedUser = "";

      if (passData) {
        for (let key in passData) {
          if (passData[key].username === userInput && passData[key].password === pwdInput) {
            isValidUser = true;
            loggedUser = passData[key].note || userInput;
            break;
          }
        }
      }

      if (isValidUser) {
        sessionStorage.setItem("funchomper_authenticated", "true");
        sessionStorage.setItem("funchomper_role", "USER");
        sessionStorage.setItem("funchomper_user", loggedUser);
        showDashboard();
      } else {
        alert("Tên đăng nhập hoặc Mật khẩu không chính xác!");
      }
    }).catch(err => alert("Lỗi kết nối Firebase: " + err.message));
  }

  function showDashboard() {
    const role = sessionStorage.getItem("funchomper_role") || "USER";
    const loggedUser = sessionStorage.getItem("funchomper_user") || "User";

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("dashboardScreen").style.display = "block";

    const roleBadge = document.getElementById("roleBadge");
    const btnPassManage = document.getElementById("btnPassManage");
    const btnChangeAdminPass = document.getElementById("btnChangeAdminPass");

    if (role === "ADMIN") {
      roleBadge.className = "role-badge role-admin";
      roleBadge.innerHTML = `<i class="fa-solid fa-user-shield"></i> ${loggedUser}`;
      btnPassManage.style.display = "flex";
      btnChangeAdminPass.style.display = "flex";
    } else {
      roleBadge.className = "role-badge role-user";
      roleBadge.innerHTML = `<i class="fa-solid fa-user"></i> ${loggedUser}`;
      btnPassManage.style.display = "none";
      btnChangeAdminPass.style.display = "none";
    }

    renderDevices();
  }

  function logout() {
    sessionStorage.clear();
    location.reload();
  }

  if (sessionStorage.getItem("funchomper_authenticated") === "true") {
    showDashboard();
  }

  function openChangeAdminPassModal() {
    document.getElementById("newAdminUser").value = currentAdminUser;
    document.getElementById("changeAdminPassModal").style.display = "flex";
  }

  function closeChangeAdminPassModal() {
    document.getElementById("changeAdminPassModal").style.display = "none";
  }

  function handleChangeAdminPass(e) {
    e.preventDefault();
    const newAdminUserVal = document.getElementById("newAdminUser").value.trim();
    const currentPass = document.getElementById("currentAdminPass").value.trim();
    const newPass = document.getElementById("newAdminPass").value.trim();
    const confirmPass = document.getElementById("confirmAdminPass").value.trim();

    if (currentPass !== currentAdminPass) {
      alert("Mật khẩu Admin hiện tại không đúng!");
      return;
    }

    if (newPass !== confirmPass) {
      alert("Xác nhận mật khẩu mới không trùng khớp!");
      return;
    }

    db.ref("admin_settings").set({
      admin_username: newAdminUserVal,
      admin_password: newPass
    })
    .then(() => {
      alert("Đã cập nhật Admin thành công!");
      currentAdminUser = newAdminUserVal;
      currentAdminPass = newPass;
      closeChangeAdminPassModal();
      document.getElementById("currentAdminPass").value = "";
      document.getElementById("newAdminPass").value = "";
      document.getElementById("confirmAdminPass").value = "";
    })
    .catch(err => alert("Lỗi khi cập nhật Admin: " + err.message));
  }

  function openEditModal(deviceId, currentName, currentGroup) {
    document.getElementById("editDeviceId").value = deviceId;
    document.getElementById("oldGroupName").value = currentGroup;
    document.getElementById("editDeviceName").value = currentName;
    document.getElementById("editGroupName").value = currentGroup;
    document.getElementById("applyGroupToAll").checked = false;

    document.getElementById("editModal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("editModal").style.display = "none";
  }

  function saveDeviceChanges() {
    const deviceId = document.getElementById("editDeviceId").value;
    const oldGroup = document.getElementById("oldGroupName").value;
    const newName = document.getElementById("editDeviceName").value.trim();
    const newGroup = document.getElementById("editGroupName").value.trim() || "Chưa Phân Nhóm";
    const applyToAll = document.getElementById("applyGroupToAll").checked;

    if (!newName) {
      alert("Vui lòng nhập tên trạm!");
      return;
    }

    if (applyToAll && oldGroup && oldGroup !== "Chưa Phân Nhóm") {
      let updates = {};
      for (let id in globalDeviceData) {
        let devGrp = globalDeviceData[id].group || "Chưa Phân Nhóm";
        if (devGrp === oldGroup) {
          updates["devices/" + id + "/group"] = newGroup;
        }
      }
      updates["devices/" + deviceId + "/device_name"] = newName;

      db.ref().update(updates)
        .then(() => {
          alert(`Đã đổi tên nhóm cho tất cả thiết bị thuộc nhóm cũ!`);
          closeModal();
        })
        .catch(err => alert("Lỗi khi cập nhật: " + err.message));
    } else {
      db.ref("devices/" + deviceId).update({
        device_name: newName,
        group: newGroup
      })
      .then(() => {
        alert("Cập nhật thành công!");
        closeModal();
      })
      .catch(err => alert("Lỗi khi lưu: " + err.message));
    }
  }

  function deleteDevice(deviceId, deviceName) {
    if (confirm(`Xóa thiết bị "${deviceName}"?`)) {
      db.ref("devices/" + deviceId).remove()
        .then(() => alert(`Đã xóa "${deviceName}"!`))
        .catch((err) => alert("Lỗi khi xóa: " + err.message));
    }
  }

  function renderDevices() {
    const tbody = document.getElementById("device-table-body");
    const filterValue = document.getElementById("groupFilter").value;
    tbody.innerHTML = "";

    if (!globalDeviceData) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding:30px;">Chưa có thiết bị nào.</td></tr>';
      return;
    }

    let count = 0;
    for (let id in globalDeviceData) {
      let dev = globalDeviceData[id];
      let devGroup = dev.group || "Chưa Phân Nhóm";

      if (filterValue !== "ALL" && devGroup !== filterValue) {
        continue;
      }

      count++;
      let defaultName = "TRAM_" + id.substring(id.length - 4);
      let devName = dev.device_name || defaultName;
      let macAddr = dev.mac || id;
      let fwVer   = dev.firmware || "1.0.0";

      let row = `<tr>
        <td><b style="font-size: 13px; color: var(--text-main);">${devName}</b></td>
        <td><span class="badge-group">${devGroup}</span></td>
        <td><span class="badge-mac">${macAddr}</span></td>
        <td><span class="badge-fw">v${fwVer}</span></td>
        <td>
          <div class="action-group">
            <button class="btn-edit" onclick="openEditModal('${id}', '${devName}', '${devGroup}')">
              <i class="fa-solid fa-pen"></i> Sửa
            </button>
            <button class="btn-delete" onclick="deleteDevice('${id}', '${devName}')">
              <i class="fa-solid fa-trash-can"></i> Xóa
            </button>
          </div>
        </td>
      </tr>`;
      tbody.innerHTML += row;
    }

    if (count === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding:30px;">Không có thiết bị trong nhóm này.</td></tr>';
    }
  }

  function updateGroupDropdown(data) {
    const filterSelect = document.getElementById("groupFilter");
    const currentSelected = filterSelect.value;
    
    let groups = new Set();
    for (let id in data) {
      groups.add(data[id].group || "Chưa Phân Nhóm");
    }

    let optionsHTML = '<option value="ALL">-- Tất cả nhóm --</option>';
    groups.forEach(g => {
      optionsHTML += `<option value="${g}">${g}</option>`;
    });

    filterSelect.innerHTML = optionsHTML;
    if ([...groups].includes(currentSelected) || currentSelected === "ALL") {
      filterSelect.value = currentSelected;
    } else {
      filterSelect.value = "ALL";
    }
  }

  function openPassModal() {
    document.getElementById("passModal").style.display = "flex";
  }

  function closePassModal() {
    document.getElementById("passModal").style.display = "none";
  }

  function handleCreatePass(e) {
    e.preventDefault();
    const note = document.getElementById("newUserNote").value.trim();
    const username = document.getElementById("newUsername").value.trim();
    const passVal = document.getElementById("newPassVal").value.trim();

    if (!note || !username || !passVal) return;

    db.ref("access_passwords").push({
      note: note,
      username: username,
      password: passVal,
      created_at: Date.now()
    }).then(() => {
      alert(`Đã tạo tài khoản User "${username}" thành công!`);
      document.getElementById("createPassForm").reset();
    }).catch(err => alert("Lỗi khi tạo User: " + err.message));
  }

  function deletePass(passId) {
    if (confirm("Xóa tài khoản User này?")) {
      db.ref("access_passwords/" + passId).remove()
        .then(() => alert("Đã xóa tài khoản User!"))
        .catch(err => alert("Lỗi khi xóa: " + err.message));
    }
  }

  function renderPassList(passData) {
    const tbody = document.getElementById("pass-table-body");
    tbody.innerHTML = "";

    if (!passData) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--text-muted);">Chưa có tài khoản User nào.</td></tr>';
      return;
    }

    for (let id in passData) {
      let item = passData[id];
      let row = `<tr>
        <td><b style="color: var(--text-main); font-size:12px;">${item.note || 'User'}</b></td>
        <td><code style="color: var(--accent-blue); font-size:11px;">${item.username || '-'}</code></td>
        <td><code style="color: var(--accent-yellow); font-size:11px;">${item.password}</code></td>
        <td style="text-align: right;">
          <button class="btn-delete" onclick="deletePass('${id}')">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </td>
      </tr>`;
      tbody.innerHTML += row;
    }
  }

  db.ref("devices").on("value", (snapshot) => {
    globalDeviceData = snapshot.val();
    if (globalDeviceData) {
      updateGroupDropdown(globalDeviceData);
    }
    renderDevices();
  });

  db.ref("access_passwords").on("value", (snapshot) => {
    globalPassData = snapshot.val();
    renderPassList(globalPassData);
  });
</script>

</body>
</html>
